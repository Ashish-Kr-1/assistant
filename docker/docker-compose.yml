version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=vector_db
      - NEO4J_URI=bolt://knowledge_graph:7687
      - POSTGRES_HOST=postgres_db
    depends_on:
      - vector_db
      - knowledge_graph
      - postgres_db

  vector_db:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  knowledge_graph:
    image: neo4j:5.16.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ipsakti_secret_pass
    volumes:
      - neo4j_data:/data

  postgres_db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ipsakti
      - POSTGRES_PASSWORD=ipsakti_db_pass
      - POSTGRES_DB=ipsakti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
